<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Контактная информация учебного интернет-магазина.">
  <title>Контакты — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/validation.js" defer></script>
</head>
<body>
  <header>
    <div class="site-header">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li><a href="index.html">Главная</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="contacts.html">Контакты</a></li>
          <li><a href="order.html">Заказ</a></li>
          <li><a href="index.html#advantages">Преимущества</a></li>
          <li><a href="index.html#popular">Популярные товары</a></li>
          <li><a href="feedback.html">Обратная связь</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заказ</span>
    </nav>

    <section class="section" id="feedback">
    <h2>Заказ</h2>
    <button class="button" type="button" id="open-feedback-dialog">
      Заполнить форму
    </button>
     </section>

     <!-- В самом низу body, перед </body> -->
<dialog class="order-dialog" id="feedback-dialog" aria-labelledby="feedback-dialog-title">
  <h2 class="order-dialog__title" id="feedback-dialog-title">Обратная связь</h2>

    <form class="order-form" action="#" method="post" novalidate>
      <div class="order-form__group">
        <label class="order-form__label" for="fb-name">Имя</label>
        <input class="order-form__input" id="order-name"  name="name"  type="text" required>
        <p class="form-error" id="order-name-error"></p>
      </div>

      <div class="order-form__group">
        <label class="order-form__label" for="fb-email">E-mail</label>
        <input class="order-form__input" id="order-email" name="email" type="email" required>
        <p class="form-error" id="order-email-error"></p>
      </div>

      <div class="order-form__group order-form__group--wide">
        <label for="order-phone">Телефон</label>
        <input class="order-form__input" id="order-phone" name="phone" type="tel">
        <p class="form-error" id="order-phone-error"></p>
      </div>

      <div class="order-form__actions">
        <button class="button button--secondary" type="button" id="close-feedback-dialog">
          Закрыть
        </button>
        <button type="submit" class="button button--secondary">Отправить заявку</button>
      </div>
      <p class="form-message" aria-live="polite"></p>
    </form>
  </dialog>
  </main>
  <footer>
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
    <p>Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>
</body>
</html>
